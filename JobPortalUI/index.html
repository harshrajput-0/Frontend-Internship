<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    <title>Job Portal UI</title>
</head>

<body>

    <main>
        <header>
            <h1>Job Finder</h1>
        </header>

        <div class="row">

            <!-- SEARCH BAR -->
            <div class="search-bar">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 30 30" fill="#6B7280">
                    <path
                        d="M13 3C7.489 3 3 7.489 3 13s4.489 10 10 10a9.95 9.95 0 0 0 6.322-2.264l5.971 5.971a1 1 0 1 0 1.414-1.414l-5.97-5.97A9.95 9.95 0 0 0 23 13c0-5.511-4.489-10-10-10m0 2c4.43 0 8 3.57 8 8s-3.57 8-8 8-8-3.57-8-8 3.57-8 8-8" />
                </svg>
                <input type="text" id="searchInput" placeholder="Search for products">
            </div>


            <!-- SELECT SECTION -->
            <select id="categorySelect">
                <option value="">All</option>
                <option value="Frontend">Frontend</option>
                <option value="Backend">Backend</option>
                <option value="Full Stack">Full Stack</option>
            </select>
        </div>




        <div id="jobList">

               


        </div>

     

    </main>

    <script>
        // Create Lucide icons
        lucide.createIcons();
    </script>
    <script src="script.js"></script>
</body>

</html>
