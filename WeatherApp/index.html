<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Weather App - HTML CSS and JavaScript</title>
</head>

<body>
    <main>
        <h1 class="title">Weather App</h1>
        <!-- Search Box -->
        <form>
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-search preview-icon">
                <path d="m21 21-4.34-4.34" />
                <circle cx="11" cy="11" r="8" />
            </svg>

            <input type="search" id="searchBox" placeholder="Enter city name">
            <!-- <button>Search</button> -->
        </form>

        <!-- Weather result box -->
        <div id="result">
            <p class="message">Search City</p>
    </main>


    <script src="script.js"></script>
</body>

</html>
