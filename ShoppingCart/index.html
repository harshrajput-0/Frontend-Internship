<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>Shopping Cart - HTML CSS and JavaScript</title>
</head>

<body>
    <main>
        <!-- HEADER -->
        <h1>Product Cart</h1>
        <p class="subtitle"></p>

        <!--============= PRODUCT FORM =============-->
        <form class="product-input card" id="input-form">
            <div class="row">
                <input type="text" id="name" placeholder="Product Name">
                <input type="number" id="price" placeholder="Price" min="1">
            </div>

            <div class="row">
                <input type="number" id="qty" placeholder="Quentity" min="1">
                <button id="add-btn" type="submit" class="primary">Add</button>
            </div>
        </form>


        <!--============= LIST =============-->
        <div class="card" id="list">
            <div class="list">
                <p class="empty-message">Your cart is empty. Add a product above.</p>
            </div>

        </div>




        <!--============= SUMMARY CARD =============-->
        <div class="summary card">
            <div id="summary">
                <div id="item-count">0 items</div>
                <div id="total">$0.00</div>
            </div>

            <button id="clear-btn">Clear Card</button>
        </div>

    </main>

    <script src="script.js"></script>
</body>

</html>
