<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>Pricing Section</title>
</head>




<body>
    <main>

        <div class="card">
            <div class="card-header">
                <span class="plan-name">Basic</span>
                <p><span class="plan-price">$39</span>/month</p>
            </div>

            <ul class="plan-fetures" id="basic-plan">

            </ul>

            <Button>Get Started</Button>
        </div>





        <div class="card popular">
            <div class="card-header">
                <span class="plan-name">Pro</span>
                <p><span class="plan-price">$99</span>/month</p>
            </div>

            <ul class="plan-fetures" id="pro-plan">

            </ul>

            <Button>Get Started</Button>
        </div>


        <div class="card">
            <div class="card-header">
                <span class="plan-name">Enterprise</span>
                <p><span class="plan-price">$149</span>/month</p>
            </div>

            <ul class="plan-fetures" id="enterprise-plan">
            </ul>

            <Button>Get Started</Button>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
