<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">
    <title>Testimonial Section</title>
</head>

<body>



    <section class="testimonial-section">

        <!--==============| TESTIMONIAL HEADER |==============-->
        <div class="testimonial-header">
            <div>
                <span class="badge">Testimonial</span>
                <h1>Hear from Our Happy<br>Customers</h1>
            </div>


            <!--========= CONTROL BUTTON GROUPS =========-->
            <div class="button-group">
                <!-- Previous Button -->
                <button class="control-buttons" id="prev" aria-label="Previous">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M0 0h24v24H0z" fill="none" />
                        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="2" d="m14 6l-6 6l6 6" />fdg
                    </svg>
                </button>

                <!-- Next Button -->
                <button class="control-buttons" id="next" aria-label="Next">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M0 0h24v24H0z" fill="none" />
                        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="2" d="m9 6l6 6l-6 6" />
                    </svg>

                </button>

            </div>
        </div>

        <!--==============| TESTIMONIAL SLIDER AREA |==============-->

        <div class="testimonial-list" id="testimonial-list">

        </div>
    </section>


    <script src="script.js"></script>
</body>

</html>
