<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap" rel="stylesheet">
    <title>Orbito Responsive Navigation</title>
</head>

<body>

    <header>
        <nav>
            <a href="#" class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-orbit preview-icon">
                    <path d="M20.341 6.484A10 10 0 0 1 10.266 21.85" />
                    <path d="M3.659 17.516A10 10 0 0 1 13.74 2.152" />
                    <circle cx="12" cy="12" r="3" />
                    <circle cx="19" cy="5" r="2" />
                    <circle cx="5" cy="19" r="2" />
                </svg>
                <h1>Orbito</h1>

            </a>

            <ul id="nav-links">
                <li><a class="links" href="">Home</a></li>
                <li><a class="links" href="">Services</a></li>
                <li><a class="links" href="">About Us</a></li>
                <li><a class="links" href="">Contact Us</a></li>
            </ul>

            <div id="menu-button">
                <!-- MENU ICON  -->
                <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-text-align-justify preview-icon">
                    <path d="M3 5h18" />
                    <path d="M3 12h18" />
                    <path d="M3 19h18" />
                </svg>

                <!-- CROSS ICON  -->
                <svg class="cross-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-x preview-icon">
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                </svg>
            </div>
        </nav>
    </header>


    <script src="script.js"></script>
</body>

</html>
