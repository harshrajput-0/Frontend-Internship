<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <title>InternHub</title>
</head>

<body>


  <header>
    <nav>
      <a href="#" class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-graduation-cap preview-icon">
          <path
            d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" />
          <path d="M22 10v6" />
          <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" />
        </svg>
        <h1>InternHub</h1>

      </a>

      <ul id="nav-links">
        <li><a class="links" href="">Home</a></li>
        <li><a class="links" href="">Services</a></li>
        <li><a class="links" href="">About Us</a></li>
        <li><a class="links" href="">Contact Us</a></li>
      </ul>

      <div id="menu-button">
        <!-- MENU ICON  -->
        <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-text-align-justify preview-icon">
          <path d="M3 5h18" />
          <path d="M3 12h18" />
          <path d="M3 19h18" />
        </svg>

        <!-- CROSS ICON  -->
        <svg class="cross-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x preview-icon">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </div>
    </nav>
  </header>

  <!-- ===================================================================== -->

  <main>
    <!-- INTERSHIP SECITON  -->
    <section>
      <h2 style="text-align: center; text-transform: uppercase; font-size: 36px; white-space: nowrap;">Our Internships
      </h2>
      <br>
      <div id="internship-list" class="grid">
      </div>
    </section>



<!-- INTERNSHIP APPLICATION TRACKER SECTION  -->
    <section id="tracker-section">
      <h2>My Applications</h2>
      <div class="intern-stats">
        <div class="stats">
          <p class="stat"><span id="total">0</span>Total</p>
          <p class="stat"><span id="in-progress">0</span>In Progress</p>
          <p class="stat"><span id="selected">0</span>Selected</p>
        </div>
      </div>

      <div id="tracker-list">
        <!-- Dynamic Rendering using JS -->
     
      </div>
    </section>







<!-- DIALOG BOX  -->

    <dialog id="applyDialog">
      <form method="dialog" class="apply-form" id="internshipForm">
        <h3>Apply for <span id="modal-role">this role</span></h3>
        <input type="text" placeholder="Your Full Name" required>
        <input type="email" placeholder="Your Email" required>
        <input type="url" placeholder="Your Linkedin Profile" required>
        <div class="btn-group">
          <button type="button" onclick="this.closest('dialog').close()" class="ghost">Cancel</button>
          <button type="submit">Submit</button>
        </div>
      </form>
    </dialog>



  </main>










  <script>
    lucide.createIcons();
  </script>
  <script src="script.js"></script>
</body>

</html>
